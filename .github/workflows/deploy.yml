name: Deploy

on:
  push:
    branches:
      - ipr22

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run tests (Jest)
        run: npm test

      - name: Deploy to Render
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Notify Telegram — success
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ Деплой успешно завершён%0A%0AРепозиторий: ${{ github.repository }}%0AВетка: ${{ github.ref_name }}%0AКоммит: ${{ github.sha }}"

      - name: Notify Telegram — failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ Деплой упал%0A%0AРепозиторий: ${{ github.repository }}%0AВетка: ${{ github.ref_name }}%0AКоммит: ${{ github.sha }}"
